# Copy this to `config.toml` and edit. `config.toml` is gitignored, so nothing about your
# machine is ever committed.

[search]

# Which game to grind -- and normally, neither, because the two take turns on their own.
#
# `start` counts how many passes each game has had on this machine and sends the next one to
# whichever has had fewer, writing its choice to state/game.txt so every search picks it up with
# no flag to remember. That exists because the old behaviour was a single default nobody changed:
# every contributor ground Cold War, and Black Ops 4 -- which has MORE unnamed assets in the five
# types that matter -- received nothing at all.
#
#   BLKOPSCW   Black Ops Cold War, 1,626,209 assets. 136,467 unnamed in the five types that
#              matter. The game most of the work has gone into: 81% of its images are named.
#   BLKOPS04   Black Ops 4, 1,023,902 assets. 141,889 unnamed in the five types -- more than Cold
#              War -- and far less picked over: 64% of images and 59% of materials named. Its
#              sound pool holds a hundred assets in total, so sound work belongs in Cold War.
#
# The `game` line below does NOT stop the turn-taking, deliberately. This file once shipped with
# it uncommented, so anybody who copied the template months ago still has it -- and treating that
# as a decision would pin those contributors to Cold War forever, silently, which is the exact
# problem the turn-taking fixes. It is only consulted when the turn-taking is switched off.
# game = "BLKOPSCW"

# Stop the turn-taking and grind only the game named above.
#
# Worth setting once one of the two is finished enough not to care about; until then, splitting
# effort is the point. `--game BLKOPS04` on any search forces one game for one run without
# touching this.
# alternate_games = false

# The asset types to hunt. A pass costs what it costs because of how many ids it is looking
# for, so hunting every pool when five hold what you want makes every pass several times
# slower for names nobody needs yet.
pools = ["xmodel", "xanim", "image", "material", "sound_asset"]

# Hunt every pool the game holds. **Leave this alone.**
#
# It reads like the ambitious setting and it is the most reliable way to waste a night, because
# the biggest pools in both games are the worthless ones. `streamkey` alone is 420,229 ids in Cold
# War and 292,133 in Black Ops 4 -- more than any nameable type -- and a pass that reached it
# returned ~290,000 genuine, useless hashes, mostly sequential d3dbsp terrain entries. Every id
# added also makes every candidate more likely to match something by coincidence.
#
# `submit` will not send names from the known-worthless pools whatever this says, so turning it on
# mostly buys a slower search. See LOW_VALUE_POOLS in src/lib.rs, and run
# `python scripts/coverage.py` to see where the unnamed assets actually are before believing a
# pool is worth a night.
all_pools = false

[paths]

# All of these default to folders inside the repository, so a fresh clone works untouched.
# Set them only if you keep things somewhere else.
# tables      = "tables"
# snapshots   = "snapshots"
# findings    = "findings"
# submissions = "submissions"

# --- Only needed if you own a game build and are capturing snapshots yourself. ---
# Everyone else grinds against a snapshot someone already captured and needs none of this.

# Strings scraped out of a game build, if you have one unpacked.
# harvest = "C:/path/to/your/harvest"

# Names borrowed from another title, used as candidates but never measured for conventions.
# borrowed = "C:/path/to/other-game-names"
