# Builds the macOS executables and commits them to `bin/macos/`, so somebody on a Mac can grind
# without installing Rust first.
#
# **Universal binaries, not one per architecture.** A `macos-latest` runner is Apple Silicon, and
# a binary built there will not run on an Intel Mac at all. Rather than shipping two folders and
# asking people to know which they are, both architectures are built and `lipo` fuses them into
# one file that runs on either. It costs one extra target and about ten seconds.
#
# The default build has no platform-specific code -- there is not one `cfg(windows)` or
# `cfg(target_os)` outside the optional `cordycep` feature, and the only dependency is gated
# behind it -- so this compiles the same source everybody else runs.
name: macos binaries

on:
  push:
    branches: [main]
    # Not on a binaries-only commit, or this workflow triggers itself for ever.
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-binaries
  cancel-in-progress: true

jobs:
  build:
    # **Only in the repository this project lives in.** A contributor's fork runs these workflows
    # too: `submit` syncs the fork's `main` from upstream before it branches, that sync is a push
    # to `main` touching `src/**`, and the fork's own Actions then build binaries and commit them
    # to the fork. The next submission branches from that head, so somebody else's rebuild of
    # `bin/` rides along in a pull request that was meant to add two text files -- and a binary
    # cannot be merged, so it conflicts against whatever this repository built in the meantime.
    # That has cost several submissions, one of which had to be taken by hand "without the binary".
    #
    # `workflow_dispatch` is covered by the same condition on purpose. A fork has nothing to gain
    # by running it: the binaries it would commit are the ones it is about to pull anyway.
    #
    # Written as "not a fork" rather than as this repository's name: a rename or a transfer would
    # leave a hardcoded `owner/name` matching nothing, both jobs skipping with a green run, and
    # `bin/` quietly going stale -- which the header above calls worse than having no committed
    # binaries at all.
    if: github.event.repository.fork == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Tests first, and this is most of the point of the job. Until now the suite had only ever
      # run on Windows and on Linux; a binary that fails its own tests must never reach `bin/`,
      # because every contributor pulling it inherits the fault.
      - run: cargo test --release

      - name: build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: fuse them into universal binaries
        run: |
          mkdir -p bin/macos
          for path in target/aarch64-apple-darwin/release/*; do
            name=$(basename "$path")
            case "$name" in *.d|*.rlib|deps|build|examples|incremental|.fingerprint) continue;; esac
            [ -f "$path" ] && [ -x "$path" ] || continue
            other="target/x86_64-apple-darwin/release/$name"
            [ -f "$other" ] || continue
            lipo -create -output "bin/macos/$name" "$path" "$other"
          done
          ls -la bin/macos
          # Prove they really are universal rather than quietly one-architecture.
          file bin/macos/* | head -5

      - name: commit them
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bin/macos
          git diff --cached --quiet && echo "binaries unchanged" && exit 0
          git commit -m "Build macOS binaries from ${GITHUB_SHA::7}"

          # Rebase and retry rather than pushing once and giving up.
          #
          # `main` moves constantly: the other platform's workflow pushes its own binaries, and
          # merged submissions land between this job starting and finishing. A single push loses
          # that race often, and the failure is misleading -- the build and the tests had both
          # passed, only the push was rejected, so the run reads as "the binaries failed to build"
          # when they were sitting there ready.
          #
          # The two workflows touch different folders, so a rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "push race on attempt $attempt, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push after five attempts"
          exit 1
