# Rebuilds everything derived from `submissions/` whenever a submission lands: the computed
# method registry in `METHODS.md`, and the combined name lists in `all_names/`.
#
# The registry is the answer to "has somebody already built this?", and it is the thing an
# arriving assistant reads before inventing a method. Keeping it by hand is what left it holding
# 10 of the 104 methods that had actually been run -- so the ninety missing ones were invisible to
# everybody who arrived afterwards, and several got invented a second time under a new name.
#
# Generating it fixed that once. Nothing kept it fixed: every merged submission adds runs, and a
# registry regenerated by hand goes stale exactly as fast as one written by hand. Within a few
# days it would be as wrong as what it replaced, and wrong in the same *invisible* way -- it looks
# current, because it looks generated.
#
# So it is regenerated here, on the one event that can change it. No contributor has to remember,
# and nobody's clone has to be current for the table in the repository to be right.
name: derived files

on:
  push:
    branches: [main]
    # A merged submission is a push touching `submissions/`. Nothing else changes what the
    # registry says, and this must not trigger on its own commit -- which touches `METHODS.md`
    # and nothing else, so it cannot.
    paths:
      - 'submissions/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: derived-files
  cancel-in-progress: true

jobs:
  regenerate:
    # Only in the repository this project lives in. A contributor's fork runs these workflows too
    # and would commit a registry built from whatever subset of submissions the fork happens to
    # hold -- then carry that rewrite of `METHODS.md` into their next pull request, which is
    # exactly the accident the binaries workflows carry a long comment about.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The report reads `submissions/` off the disk and needs nothing else -- no tables, no
      # snapshots, no network. That is why this job is thirty seconds rather than a build.
      - name: regenerate the registry
        run: python scripts/methods_report.py --registry --write

      # Every name the project has recovered, as one sorted file per game and asset type.
      #
      # Sorted matters here beyond readability. This is 5 MB rewritten on every submission, and a
      # sorted list that mostly gains lines deltas down to the lines it gained -- an unsorted one
      # would store the whole file again each time and the history would grow by gigabytes.
      - name: rebuild the combined name lists
        run: python scripts/collect_names.py

      # A sanity check on the thing that just wrote into a documentation file. `check_docs.py`
      # verifies that every path and script name the markdown mentions actually exists, so a
      # generator that mangled the file fails here rather than being committed.
      - name: the documentation still describes this repository
        run: python scripts/check_docs.py

      - name: commit it
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add METHODS.md all_names
          git diff --cached --quiet && echo "nothing derived changed" && exit 0
          git commit -m "Rebuild the registry and name lists from ${GITHUB_SHA::7}"

          # `main` moves constantly -- both binaries workflows push, and submissions merge in
          # batches -- so a single push loses the race often enough to be worth retrying. The
          # rebase cannot conflict: nothing else writes the block between the generated-registry
          # markers, and nothing else writes `all_names/`.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "push race on attempt $attempt, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push after five attempts"
          exit 1
